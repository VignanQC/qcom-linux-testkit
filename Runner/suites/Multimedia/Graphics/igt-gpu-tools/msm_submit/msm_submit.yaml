metadata:
  name: msm_submit
  format: "Lava-Test Test Definition 1.0"
  description: "Validates the msm GEM submit ioctl with valid and invalid command submissions. Runs the IGT msm_submit test against the upstream msm DRM GPU driver."
  os:
    - linux
  scope:
    - functional

params:
  IGT_BIN_PATH: "/usr/libexec/igt-gpu-tools/msm_submit"
  IGT_TIMEOUT: "300"

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Multimedia/Graphics/igt-gpu-tools/msm_submit
    - export IGT_TIMEOUT="${IGT_TIMEOUT}"
    - ./run.sh --bin-path "${IGT_BIN_PATH}" || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh msm_submit.res || true
