metadata:
  name: msm_recovery
  format: "Lava-Test Test Definition 1.0"
  description: "Validates GPU hang detection and recovery. Deliberately triggers GPU hangs. Runs the IGT msm_recovery test against the upstream msm DRM GPU driver."
  os:
    - linux
  scope:
    - functional

params:
  IGT_BIN_PATH: "/usr/libexec/igt-gpu-tools/msm_recovery"
  IGT_TIMEOUT: "600"

run:
  steps:
    - REPO_PATH=$PWD
    - cd Runner/suites/Multimedia/Graphics/igt-gpu-tools/msm_recovery
    - export IGT_TIMEOUT="${IGT_TIMEOUT}"
    - ./run.sh --bin-path "${IGT_BIN_PATH}" || true
    - $REPO_PATH/Runner/utils/send-to-lava.sh msm_recovery.res || true
